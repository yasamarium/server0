<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Aurora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-card: #242424;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #007bff;
            --border: #3a3a3a;
            --hover-bg: #2f2f2f;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent: #007bff;
            --border: #e9ecef;
            --hover-bg: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            background: var(--hover-bg);
            border-color: var(--accent);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            animation: slideUp 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.2s backwards;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .content {
            padding: 0 20px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .member-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .member-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 15px 40px rgba(0, 123, 255, 0.15);
        }

        .member-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .member-name {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verified-badge {
            width: 22px;
            height: 22px;
            background: #1d9bf0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            animation: verifiedPulse 3s ease-in-out infinite;
        }

        @keyframes verifiedPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .verified-badge::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1d9bf0;
            border-radius: 50%;
            opacity: 0.3;
            animation: ripple 3s ease-out infinite;
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .verified-badge::after {
            content: '✓';
            color: white;
            font-size: 13px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .member-role {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .member-class {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .project-section {
            text-align: center;
            padding: 50px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-top: 20px;
        }

        .project-section h2 {
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .project-btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.3);
        }

        .project-btn:active {
            transform: translateY(-1px);
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (max-width: 768px) {
            .theme-toggle {
                top: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .header h1 {
                font-size: 36px;
            }

            .header p {
                font-size: 16px;
            }

            .team-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .project-section {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
    </div>

    <div class="container">
        <div class="header">
            <h1>TEAM AURORA</h1>
            <p> ✨️ | hey there! 🌸</p>
        </div>

        <div class="content">
            <div class="team-grid">
                <div class="member-card">
                    <div class="member-header">
                        <div class="member-name">
                            Sourav
                            <span class="verified-badge"></span>
                        </div>
                    </div>
                    <div class="member-role">Team Leader | Analyst | Presentation Site Developer</div>
                    <div class="member-class">Class XI (PCM)</div>
                </div>

                <div class="member-card">
                    <div class="member-header">
                        <div class="member-name">Pragyan Pratim Das</div>
                    </div>
                    <div class="member-role">Documenter</div>
                    <div class="member-class">Class XI (PCM)</div>
                </div>

                <div class="member-card">
                    <div class="member-header">
                        <div class="member-name">
                            Prithi Singh Saud
                            <span class="verified-badge"></span>
                        </div>
                    </div>
                    <div class="member-role">Researcher</div>
                    <div class="member-class">Class XI (PCM)</div>
                </div>

                <div class="member-card">
                    <div class="member-header">
                        <div class="member-name">Mriganga Das</div>
                    </div>
                    <div class="member-role">Presentation Speaker | Secondary Analyst</div>
                    <div class="member-class">Class XI (PCM)</div>
                </div>
            </div>

            <div class="project-section">
                <h2>Our Project</h2>
                <a href="https://aurorapresents.github.io/log/main.html" class="project-btn" target="_blank">VIEW PROJECT</a>
            </div>
        </div>
    </div>

    <script>
        // Default night mode
        document.documentElement.setAttribute('data-theme', 'dark');
        
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const themeIcon = document.getElementById('themeIcon');
            
            document.documentElement.setAttribute('data-theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
